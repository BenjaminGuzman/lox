name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y cmake build-essential gcc-14 g++-14 llvm-dev

    - name: Setup LLVM
      if: runner.os != 'Linux'
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 18

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      env:
        CC: gcc-14
        CXX: g++-14

    - name: Configure CMake (macOS)
      if: runner.os != 'Linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -C Release

    - name: Rename executable
      run: mv build/lox-exec lox-${{ runner.os }}-x86_64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lox-${{ runner.os }}
        path: lox-*

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare binaries for release
      run: |
        find artifacts -type f -exec mv {} . \;
        chmod +x lox-Linux-x86_64
        chmod +x lox-macOS-x86_64

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: lox-*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
